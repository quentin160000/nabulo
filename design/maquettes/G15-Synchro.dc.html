<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Synchro</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{cursor:pointer;font-family:inherit}
.vscroll{scrollbar-width:none}
.vscroll::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:3px;height:24px;margin-left:2px;vertical-align:middle;background:currentColor;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{bg}}; font-family: 'Fredoka', system-ui, sans-serif; color: {{ink}}; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; align-items: center; gap: 10px"><button aria-label="Retour" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 0; background: {{panel}}; display: flex; align-items: center; justify-content: center; padding: 0; color: {{ink}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 23px; font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 0 {{ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Synchro</h1><div style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 19px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -5px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; white-space: nowrap">Équipe 34 pts</div></header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #FFFFFF; font-size: 15px; font-weight: 700"><span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 15px; border: 3px solid transparent; background: #FF86C8; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{ink}}">K</span>Kiwi_33 <span style="opacity: 0.7">+</span> Lynx<span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; box-sizing: border-box; border-radius: 15px; border: 3px solid transparent; background: #7FE0B4; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: {{ink}}">L</span></div>
<div style="box-sizing: border-box; border-radius: 20px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); padding: 10px 12px"><div style="text-align: center"><div style="font-size: 13px; font-weight: 600; color: {{inkSoft}}">Écrivez tous les deux un mot associé à</div><div style="font-size: 40px; font-weight: 700; line-height: 1.15">{{cue}}</div><div style="font-size: 13px; font-weight: 600; color: {{inkSoft}}">Plus vos mots sont proches, plus vous marquez</div></div></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px">
<div style="color: #FFFFFF; font-size: 14px; font-weight: 700; text-shadow: 0 2px 0 {{ink}}">{{resTitle}}</div>
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1 1 0; box-sizing: border-box; border-radius: 18px; border: 3px solid color-mix(in srgb, #FF86C8 55%, white); background: linear-gradient(to bottom right, #FF86C8 50%, color-mix(in srgb, #FF86C8 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, #FF86C8 84%, #3A2A7A); padding: 8px; text-align: center"><div style="font-size: 12px; font-weight: 700">Toi</div><div style="font-size: 22px; font-weight: 700">{{a}}</div></div>
<div style="width: 70px; flex-shrink: 0; box-sizing: border-box; border-radius: 35px; border: 3px solid color-mix(in srgb, #FFD45C 55%, white); background: linear-gradient(to bottom right, #FFD45C 50%, color-mix(in srgb, #FFD45C 95%, #3A2A7A) 50%); height: 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; box-shadow: inset 0 -5px 0 color-mix(in srgb, #FFD45C 84%, #3A2A7A)"><span style="font-size: 20px; font-weight: 700; line-height: 1">{{t}}</span><span style="font-size: 12px; font-weight: 700">+{{pts}}</span></div>
<div style="flex: 1 1 0; box-sizing: border-box; border-radius: 18px; border: 3px solid color-mix(in srgb, #7FE0B4 55%, white); background: linear-gradient(to bottom right, #7FE0B4 50%, color-mix(in srgb, #7FE0B4 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, #7FE0B4 84%, #3A2A7A); padding: 8px; text-align: center"><div style="font-size: 12px; font-weight: 700">Lynx</div><div style="font-size: 22px; font-weight: 700">{{b}}</div></div>
</div>
</div>
</div>
<div style="display: flex; gap: 8px">
<div role="textbox" aria-label="Ton mot associé" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; padding: 0 14px; border-radius: 17px; border: 2px solid #D9D1F2; background: #FFFFFF; box-shadow: inset 0 -6px 0 color-mix(in srgb, #FFFFFF 84%, #3A2A7A); display: flex; align-items: center; font-size: 21px; font-weight: 500; overflow: hidden; white-space: nowrap">
<sc-if value="{{empty}}" hint-placeholder-val="{{ true }}"><span style="color: #7C7399">Ton mot associé</span></sc-if>
<span>{{word}}</span><span class="caret"></span>
</div>
<button onClick="{{submit}}" style="height: 52px; padding: 0 14px; border-radius: 17px; border: 2px solid color-mix(in srgb, {{accent}} 55%, white); background: linear-gradient(to bottom right, {{accent}} 50%, color-mix(in srgb, {{accent}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, {{accent}} 84%, #3A2A7A); font-size: 17px; font-weight: 700; color: {{ink}}">Valider</button>
</div>
</div>
<dc-import name="Keyboard" variant="systeme" on-key="{{onKey}}" hint-size="390px,286px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"teinteViolet":{"editor":"range","min":0,"max":360,"step":1,"default":256,"unit":"°","section":"Couleurs"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = Object.assign({ word: '' }, { r: 0, a: 'sable', b: 'soleil', t: 72, prev: 'plage' });
}
tempFor(w) {
let h = 7;
for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 9973;
return Math.round(((h / 9973) * 120 - 28) * 10) / 10;
}
col(t) { return t >= 100 ? '#FFD23F' : t >= 60 ? '#FF5A36' : t >= 40 ? '#FF9A3C' : t >= 20 ? '#7CCDEF' : t >= 0 ? '#A9C6F2' : '#5B8DEF'; }
fmt(t) { return Math.round(t) + '°'; }
press(k) {
const w = this.state.word;
if (k === '⌫') { this.setState({ word: w.slice(0, -1) }); return; }
if (k === 'Entrée') { this.submit(); return; }
if (k === '⇧' || k === '123' || k === 'espace' || w.length >= 16) return;
this.setState({ word: w + k.toLowerCase() });
}
submit() {
const w = this.state.word.trim();
if (!w) return;
const partner = ['flocon', 'cartable', 'guitare', 'champignon', 'vague'][this.state.r % 5];
const t = Math.abs(this.tempFor(w + partner)) % 85 + 10;
this.setState({ word: '', prev: this.cues[this.state.r], r: (this.state.r + 1) % 5, a: w, b: partner, t: t });
}
get cues() { return ['plage', 'hiver', 'école', 'musique', 'forêt']; }
renderVals() {
const hV = this.props.teinteViolet ?? 256;
const s = this.state;
const ink = 'hsl(' + hV + ', 45%, 16%)';

return Object.assign({
bg: 'hsl(' + hV + ', 66%, 56%)',
bgDeep: 'hsl(' + hV + ', 66%, 42%)',
panel: 'hsl(' + hV + ', 66%, 96%)',
ink: ink,
inkSoft: 'hsl(' + hV + ', 28%, 34%)',
accent: '#FFD45C',
word: s.word,
empty: s.word === '',
submit: () => this.submit(),
onKey: (k) => this.press(k)
}, {
cue: this.cues[s.r],
resTitle: 'Manche précédente · « ' + s.prev + ' »',
a: s.a, b: s.b, t: this.fmt(s.t), pts: Math.round(s.t / 10)
});
}
}
</script>
</body>
</html>
