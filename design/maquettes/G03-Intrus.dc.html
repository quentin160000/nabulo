<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>L'intrus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{cursor:pointer;font-family:inherit}
.vscroll{scrollbar-width:none}
.vscroll::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:3px;height:24px;margin-left:2px;vertical-align:middle;background:currentColor;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{bg}}; font-family: 'Fredoka', system-ui, sans-serif; color: {{ink}}; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; align-items: center; gap: 10px"><button aria-label="Retour" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 0; background: {{panel}}; display: flex; align-items: center; justify-content: center; padding: 0; color: {{ink}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 23px; font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 0 {{ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">L’intrus</h1><div style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 19px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -5px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; white-space: nowrap">Série 3/10</div></header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<img src="/_blob/6189b69255bba7718a2aef82ae49b664" alt="Nabulo" style="width: 70px; height: 70px; display: block; flex-shrink: 0">
<div style="position: relative; flex-grow: 1; box-sizing: border-box; padding: 8px 12px; border-radius: 16px; border: 3px solid #D9D1F2; background: linear-gradient(to bottom right, #FFFFFF 50%, color-mix(in srgb, #FFFFFF 95%, #3A2A7A) 50%); box-shadow: inset 0 -5px 0 color-mix(in srgb, #FFFFFF 84%, #3A2A7A); font-size: 15px; font-weight: 600; line-height: 1.25">
<span style="position: absolute; left: -10px; top: 50%; margin-top: -7px; width: 13px; height: 13px; background: #FFFFFF; border-left: 3px solid #D9D1F2; border-bottom: 3px solid #D9D1F2; transform: rotate(45deg)"></span>Lequel de ces mots n’a rien à faire avec les autres ?</div>
</div>

<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 12px">
<sc-for list="{{items}}" as="it" hint-placeholder-count="5">
<button onClick="{{it.pick}}" aria-label="{{it.word}}" style="height: 70px; box-sizing: border-box; padding: 0 16px; border-radius: 20px; border: 3px solid color-mix(in srgb, {{it.bg}} 55%, white); background: linear-gradient(to bottom right, {{it.bg}} 50%, color-mix(in srgb, {{it.bg}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -7px 0 color-mix(in srgb, {{it.bg}} 84%, #3A2A7A); display: flex; align-items: center; justify-content: space-between; font-size: 26px; font-weight: 700; color: {{ink}}">
<span>{{it.word}}</span><span style="font-size: 16px; font-weight: 700; opacity: {{it.op}}">{{it.temp}}</span>
</button>
</sc-for>
</div>
<div role="status" style="min-height: 44px; box-sizing: border-box; border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; background: {{fbBg}}; font-size: 16px; font-weight: 700; color: {{fbCol}}">{{fb}}</div>
<div style="display: flex; gap: 10px">
<div style="flex-grow: 1; display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-size: 16px; font-weight: 700; text-shadow: 0 2px 0 {{ink}}">Série de bonnes réponses : {{streak}}</div>
<button onClick="{{next}}" style="height: 48px; padding: 0 18px; border-radius: 16px; border: 3px solid color-mix(in srgb, {{accent}} 55%, white); background: linear-gradient(to bottom right, {{accent}} 50%, color-mix(in srgb, {{accent}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, {{accent}} 84%, #3A2A7A); font-size: 17px; font-weight: 700; color: {{ink}}">Suivant</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"teinteViolet":{"editor":"range","min":0,"max":360,"step":1,"default":256,"unit":"°","section":"Couleurs"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = Object.assign({ word: '' }, { r: 0, picked: null, streak: 4 });
}
tempFor(w) {
let h = 7;
for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 9973;
return Math.round(((h / 9973) * 120 - 28) * 10) / 10;
}
col(t) { return t >= 100 ? '#FFD23F' : t >= 60 ? '#FF5A36' : t >= 40 ? '#FF9A3C' : t >= 20 ? '#7CCDEF' : t >= 0 ? '#A9C6F2' : '#5B8DEF'; }
fmt(t) { return Math.round(t) + '°'; }
press(k) {
const w = this.state.word;
if (k === '⌫') { this.setState({ word: w.slice(0, -1) }); return; }
if (k === 'Entrée') { this.submit(); return; }
if (k === '⇧' || k === '123' || k === 'espace' || w.length >= 16) return;
this.setState({ word: w + k.toLowerCase() });
}
submit() {
const w = this.state.word.trim();
if (!w) return;

}
get rounds() { return [
{ w: ['pomme', 'poire', 'cerise', 'cravate', 'banane'], t: [61, 58, 55, 7, 49], odd: 3 },
{ w: ['piano', 'guitare', 'tambour', 'violon', 'tulipe'], t: [64, 60, 52, 57, 4], odd: 4 },
{ w: ['nuage', 'pluie', 'parapluie', 'orage', 'fourchette'], t: [59, 66, 48, 62, 2], odd: 4 }]; }
renderVals() {
const hV = this.props.teinteViolet ?? 256;
const s = this.state;
const ink = 'hsl(' + hV + ', 45%, 16%)';
const r = this.rounds[s.r];
const done = s.picked !== null;
const ok = done && s.picked === r.odd;
return Object.assign({
bg: 'hsl(' + hV + ', 66%, 56%)',
bgDeep: 'hsl(' + hV + ', 66%, 42%)',
panel: 'hsl(' + hV + ', 66%, 96%)',
ink: ink,
inkSoft: 'hsl(' + hV + ', 28%, 34%)',
accent: '#FFD45C',
word: s.word,
empty: s.word === '',
submit: () => this.submit(),
onKey: (k) => this.press(k)
}, {
items: r.w.map((w, i) => ({ word: w, temp: r.t[i] + '° des autres', op: done ? 1 : 0,
bg: !done ? 'hsl(' + hV + ', 66%, 96%)' : i === r.odd ? '#7CE0B5' : i === s.picked ? '#FFB3A8' : 'hsl(' + hV + ', 66%, 96%)',
pick: () => { if (s.picked === null) this.setState({ picked: i, streak: i === r.odd ? s.streak + 1 : 0 }); } })),
fb: !done ? 'Touche l’intrus' : ok ? 'Bien vu ! « ' + r.w[r.odd] + ' » est à ' + r.t[r.odd] + '° des autres' : 'Raté, l’intrus était « ' + r.w[r.odd] + ' »',
fbBg: !done ? 'rgba(255,255,255,0.14)' : ok ? '#7CE0B5' : '#FFD0C2',
fbCol: done ? ink : '#FFFFFF',
streak: s.streak,
next: () => this.setState({ r: (s.r + 1) % this.rounds.length, picked: null })
});
}
}
</script>
</body>
</html>
