<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Plus chaud plus froid</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{cursor:pointer;font-family:inherit}
.vscroll{scrollbar-width:none}
.vscroll::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:3px;height:24px;margin-left:2px;vertical-align:middle;background:currentColor;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{bg}}; font-family: 'Fredoka', system-ui, sans-serif; color: {{ink}}; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; align-items: center; gap: 10px"><button aria-label="Retour" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 0; background: {{panel}}; display: flex; align-items: center; justify-content: center; padding: 0; color: {{ink}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 23px; font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 0 {{ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Plus chaud ?</h1><div style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 19px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -5px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; white-space: nowrap"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8" fill="#FFD45C"></circle><path d="M12 9v4l2.5 2M9.5 2.5h5"></path></svg>0:07</div></header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">
<div style="height: 10px; border-radius: 5px; background: rgba(255,255,255,0.2); overflow: hidden"><div style="width: 70%; height: 100%; border-radius: 5px; background: #FFD45C"></div></div>
<div style="box-sizing: border-box; border-radius: 20px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); padding: 10px 12px"><div style="text-align: center"><div style="font-size: 14px; font-weight: 600; color: {{inkSoft}}">Le mot cible est</div><div style="font-size: 34px; font-weight: 700">océan</div></div></div>
<div style="text-align: center; color: #FFFFFF; font-size: 17px; font-weight: 700; text-shadow: 0 2px 0 {{ink}}">Lequel est le plus proche ?</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="2">
<button onClick="{{o.pick}}" style="flex: 1 1 0; box-sizing: border-box; border-radius: 26px; border: 4px solid color-mix(in srgb, {{o.bg}} 55%, white); background: linear-gradient(to bottom right, {{o.bg}} 50%, color-mix(in srgb, {{o.bg}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -8px 0 color-mix(in srgb, {{o.bg}} 84%, #3A2A7A); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: {{ink}}">
<span style="font-size: 38px; font-weight: 700">{{o.word}}</span>
<span style="font-size: 20px; font-weight: 700; opacity: {{o.op}}">{{o.temp}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; color: #FFFFFF; font-size: 17px; font-weight: 700; text-shadow: 0 2px 0 {{ink}}"><span>Série : {{streak}}</span><span>{{fb}}</span></div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"teinteViolet":{"editor":"range","min":0,"max":360,"step":1,"default":256,"unit":"°","section":"Couleurs"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = Object.assign({ word: '' }, { r: 0, picked: null, streak: 6 });
}
tempFor(w) {
let h = 7;
for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 9973;
return Math.round(((h / 9973) * 120 - 28) * 10) / 10;
}
col(t) { return t >= 100 ? '#FFD23F' : t >= 60 ? '#FF5A36' : t >= 40 ? '#FF9A3C' : t >= 20 ? '#7CCDEF' : t >= 0 ? '#A9C6F2' : '#5B8DEF'; }
fmt(t) { return Math.round(t) + '°'; }
press(k) {
const w = this.state.word;
if (k === '⌫') { this.setState({ word: w.slice(0, -1) }); return; }
if (k === 'Entrée') { this.submit(); return; }
if (k === '⇧' || k === '123' || k === 'espace' || w.length >= 16) return;
this.setState({ word: w + k.toLowerCase() });
}
submit() {
const w = this.state.word.trim();
if (!w) return;

}
get rounds() { return [
{ a: 'vague', b: 'désert', ta: 74, tb: 9 },
{ a: 'sel', b: 'poisson', ta: 46, tb: 58 },
{ a: 'bleu', b: 'navire', ta: 52, tb: 49 }]; }
renderVals() {
const hV = this.props.teinteViolet ?? 256;
const s = this.state;
const ink = 'hsl(' + hV + ', 45%, 16%)';
const r = this.rounds[s.r];
const done = s.picked !== null;
const best = r.ta >= r.tb ? 0 : 1;
const go = (i) => { if (s.picked !== null) { this.setState({ r: (s.r + 1) % this.rounds.length, picked: null }); return; } this.setState({ picked: i, streak: i === best ? s.streak + 1 : 0 }); };
return Object.assign({
bg: 'hsl(' + hV + ', 66%, 56%)',
bgDeep: 'hsl(' + hV + ', 66%, 42%)',
panel: 'hsl(' + hV + ', 66%, 96%)',
ink: ink,
inkSoft: 'hsl(' + hV + ', 28%, 34%)',
accent: '#FFD45C',
word: s.word,
empty: s.word === '',
submit: () => this.submit(),
onKey: (k) => this.press(k)
}, {
opts: [[r.a, r.ta], [r.b, r.tb]].map((o, i) => ({ word: o[0], temp: done ? o[1] + '°' : '?', op: done ? 1 : 0.4,
bg: !done ? 'hsl(' + hV + ', 66%, 96%)' : i === best ? '#7CE0B5' : i === s.picked ? '#FFB3A8' : 'hsl(' + hV + ', 66%, 96%)', pick: () => go(i) })),
streak: s.streak,
fb: !done ? 'Touche un mot' : s.picked === best ? 'Bien joué ! Touche pour la suite' : 'Raté ! Touche pour la suite' 
});
}
}
</script>
</body>
</html>
