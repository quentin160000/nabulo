<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Le bluff</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{cursor:pointer;font-family:inherit}
.vscroll{scrollbar-width:none}
.vscroll::-webkit-scrollbar{display:none}
.caret{display:inline-block;width:3px;height:24px;margin-left:2px;vertical-align:middle;background:currentColor;border-radius:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.caret{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: {{bg}}; font-family: 'Fredoka', system-ui, sans-serif; color: {{ink}}; overflow: hidden">
<div style="flex-grow: 1; min-height: 0; box-sizing: border-box; padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px">
<header style="display: flex; align-items: center; gap: 10px"><button aria-label="Retour" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 14px; border: 0; background: {{panel}}; display: flex; align-items: center; justify-content: center; padding: 0; color: {{ink}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button><h1 style="margin: 0; flex-grow: 1; min-width: 0; font-size: 23px; font-weight: 700; color: #FFFFFF; text-shadow: 0 2px 0 {{ink}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Le bluff</h1><div style="height: 38px; box-sizing: border-box; padding: 0 12px; border-radius: 19px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -5px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 700; white-space: nowrap">Manche 2/6</div></header>
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; gap: 6px">
<sc-for list="{{players}}" as="p" hint-placeholder-count="4">
<div style="flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; border-radius: 14px; background: {{p.bg}}; color: #FFFFFF">
<span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 20px; border: 3px solid transparent; background: {{p.col}}; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: {{ink}}">{{p.l}}</span>
<span style="font-size: 12px; font-weight: 700">{{p.name}}</span><span style="font-size: 13px; font-weight: 700">{{p.pts}} pts</span>
</div>
</sc-for>
</div>
<div style="box-sizing: border-box; border-radius: 20px; border: 3px solid color-mix(in srgb, {{panel}} 55%, white); background: linear-gradient(to bottom right, {{panel}} 50%, color-mix(in srgb, {{panel}} 95%, #3A2A7A) 50%); box-shadow: inset 0 -6px 0 color-mix(in srgb, {{panel}} 84%, #3A2A7A); padding: 10px 12px"><div style="text-align: center"><div style="font-size: 13px; font-weight: 600; color: {{inkSoft}}">Lynx a choisi un mot secret parmi les 4 et donne l’indice</div><div style="font-size: 38px; font-weight: 700; line-height: 1.2">« piquant »</div></div></div>
<div style="text-align: center; color: #FFFFFF; font-size: 16px; font-weight: 700; text-shadow: 0 2px 0 {{ink}}">Quel mot visait-il ?</div>
<div style="flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
<button onClick="{{o.pick}}" style="box-sizing: border-box; border-radius: 22px; border: 4px solid transparent; background: {{o.bg}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: {{ink}}">
<span style="font-size: 26px; font-weight: 700">{{o.w}}</span><span style="font-size: 14px; font-weight: 700; opacity: {{o.op}}">{{o.t}}</span><span style="font-size: 12px; font-weight: 600; opacity: {{o.op}}">{{o.votes}}</span>
</button>
</sc-for>
</div>
<div role="status" style="min-height: 44px; box-sizing: border-box; border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; justify-content: center; text-align: center; background: {{fbBg}}; font-size: 15px; font-weight: 700; color: {{fbCol}}">{{fb}}</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"teinteViolet":{"editor":"range","min":0,"max":360,"step":1,"default":256,"unit":"°","section":"Couleurs"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = Object.assign({ word: '' }, { picked: null });
}
tempFor(w) {
let h = 7;
for (let i = 0; i < w.length; i++) h = (h * 31 + w.charCodeAt(i)) % 9973;
return Math.round(((h / 9973) * 120 - 28) * 10) / 10;
}
col(t) { return t >= 100 ? '#FFD23F' : t >= 60 ? '#FF5A36' : t >= 40 ? '#FF9A3C' : t >= 20 ? '#7CCDEF' : t >= 0 ? '#A9C6F2' : '#5B8DEF'; }
fmt(t) { return Math.round(t) + '°'; }
press(k) {
const w = this.state.word;
if (k === '⌫') { this.setState({ word: w.slice(0, -1) }); return; }
if (k === 'Entrée') { this.submit(); return; }
if (k === '⇧' || k === '123' || k === 'espace' || w.length >= 16) return;
this.setState({ word: w + k.toLowerCase() });
}
submit() {
const w = this.state.word.trim();
if (!w) return;

}

renderVals() {
const hV = this.props.teinteViolet ?? 256;
const s = this.state;
const ink = 'hsl(' + hV + ', 45%, 16%)';
const W = [['cactus', 71, 'Max'], ['piment', 64, 'Léa'], ['hérisson', 69, ''], ['rose', 38, '']];
const target = 2;
const done = s.picked !== null;
const ok = done && s.picked === target;
return Object.assign({
bg: 'hsl(' + hV + ', 66%, 56%)',
bgDeep: 'hsl(' + hV + ', 66%, 42%)',
panel: 'hsl(' + hV + ', 66%, 96%)',
ink: ink,
inkSoft: 'hsl(' + hV + ', 28%, 34%)',
accent: '#FFD45C',
word: s.word,
empty: s.word === '',
submit: () => this.submit(),
onKey: (k) => this.press(k)
}, {
players: [['K', 'Kiwi_33', '#FF86C8', ok ? 9 : 6], ['L', 'Lynx', '#7FE0B4', 7], ['M', 'Max', '#FFD45C', 5], ['É', 'Léa', '#C9B8FF', 8]].map((p, i) => ({ l: p[0], name: p[1], col: p[2], pts: p[3], bg: i === 1 ? 'rgba(255,255,255,0.22)' : 'transparent' })),
opts: W.map((o, i) => ({ w: o[0], t: done ? 'à ' + o[1] + '° de l’indice' : '', votes: done ? (o[2] ? 'vote de ' + o[2] : i === s.picked ? 'ton vote' : '') : '', op: done ? 1 : 0,
bg: !done ? 'hsl(' + hV + ', 66%, 96%)' : i === target ? '#7CE0B5' : i === s.picked ? '#FFB3A8' : 'hsl(' + hV + ', 66%, 96%)',
pick: () => { if (!done) this.setState({ picked: i }); else this.setState({ picked: null }); } })),
fb: !done ? 'Vote pour un mot' : ok ? 'Bien vu, c’était « hérisson » ! +3 pour toi' : 'Raté, il visait « hérisson » · Lynx gagne 2 points pour son bluff',
fbBg: !done ? 'rgba(255,255,255,0.14)' : ok ? '#7CE0B5' : '#FFD0C2',
fbCol: done ? ink : '#FFFFFF' 
});
}
}
</script>
</body>
</html>
