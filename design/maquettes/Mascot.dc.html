<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mascotte feu-glace</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.anim{transform-box:fill-box;transform-origin:center}
.bob{animation:bob 2.4s ease-in-out infinite}
.shiver{animation:shiver .22s linear infinite}
.flicker{animation:flicker .9s ease-in-out infinite;transform-origin:50% 100%}
.spin{animation:spin 12s linear infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes shiver{0%{transform:translateX(-1.5px)}50%{transform:translateX(1.5px)}100%{transform:translateX(-1.5px)}}
@keyframes flicker{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,0.96)}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.bob,.shiver,.flicker,.spin{animation:none}}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center">

<sc-if value="{{isGlacial}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Glaçon qui grelotte">
<g class="anim shiver">
<path d="M30 84 L38 92 L30 100" fill="none" stroke="#2B2150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M170 84 L162 92 L170 100" fill="none" stroke="#2B2150" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M62 150 L72 184 L82 150 Z" fill="#BDE7FF" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<path d="M112 150 L119 174 L126 150 Z" fill="#BDE7FF" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<rect x="42" y="50" width="116" height="110" rx="24" fill="#BDE7FF" stroke="#2B2150" stroke-width="6"></rect>
<path d="M46 72 C 46 54, 60 48, 72 52 C 80 42, 98 42, 106 50 C 116 42, 136 46, 140 56 C 152 56, 156 68, 152 74 Z" fill="#FFFFFF" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<path d="M58 88 L58 120" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
<path d="M74 98 L86 106 L74 114" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M126 98 L114 106 L126 114" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></path>
<ellipse cx="70" cy="126" rx="8" ry="5" fill="#86C2F0"></ellipse>
<ellipse cx="130" cy="126" rx="8" ry="5" fill="#86C2F0"></ellipse>
<path d="M84 134 Q 92 127 100 134 Q 108 141 116 134" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{isFroid}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Boule de neige avec écharpe">
<g stroke="#86C2F0" stroke-width="4" stroke-linecap="round">
<path d="M22 50 L42 50 M27 41 L37 59 M27 59 L37 41"></path>
<path d="M160 36 L178 36 M164.5 28 L173.5 44 M164.5 44 L173.5 28"></path>
</g>
<g class="anim bob">
<circle cx="100" cy="106" r="62" fill="#F4F8FF" stroke="#2B2150" stroke-width="6"></circle>
<path d="M58 116 C 68 150, 132 150, 142 116" fill="none" stroke="#D6E6FA" stroke-width="10" stroke-linecap="round"></path>
<path d="M126 150 L134 186 L150 182 L142 148 Z" fill="#5B8DEF" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<path d="M46 134 C 72 152, 128 152, 154 134 L 156 152 C 128 170, 72 170, 44 152 Z" fill="#5B8DEF" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<path d="M70 150 L76 141 M90 154 L94 144 M110 154 L106 144 M130 150 L124 141" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"></path>
<circle cx="82" cy="98" r="7" fill="#2B2150"></circle>
<circle cx="118" cy="98" r="7" fill="#2B2150"></circle>
<circle cx="84.5" cy="95.5" r="2.2" fill="#FFFFFF"></circle>
<circle cx="120.5" cy="95.5" r="2.2" fill="#FFFFFF"></circle>
<ellipse cx="68" cy="114" rx="8" ry="5" fill="#C9DDF8"></ellipse>
<ellipse cx="132" cy="114" rx="8" ry="5" fill="#C9DDF8"></ellipse>
<path d="M90 122 Q 100 115 110 122" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{isTiede}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Goutte d'eau perplexe">
<g class="anim bob">
<path d="M100 28 C 118 58, 152 92, 152 124 A 52 52 0 0 1 48 124 C 48 92, 82 58, 100 28 Z" fill="#9AD8F5" stroke="#2B2150" stroke-width="6" stroke-linejoin="round"></path>
<path d="M68 116 C 68 100, 76 88, 86 80" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"></path>
<ellipse cx="84" cy="124" rx="6.5" ry="8.5" fill="#2B2150"></ellipse>
<ellipse cx="116" cy="124" rx="6.5" ry="8.5" fill="#2B2150"></ellipse>
<circle cx="86" cy="121" r="2.2" fill="#FFFFFF"></circle>
<circle cx="118" cy="121" r="2.2" fill="#FFFFFF"></circle>
<path d="M90 150 L110 150" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path>
<path d="M152 52 C 158 62, 162 68, 162 74 A 8 8 0 0 1 146 74 C 146 68, 148 62, 152 52 Z" fill="#FFFFFF" stroke="#2B2150" stroke-width="3.5" stroke-linejoin="round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{isChaud}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Braise souriante">
<circle cx="40" cy="74" r="5" fill="#FFC23D" stroke="#2B2150" stroke-width="3"></circle>
<circle cx="164" cy="86" r="6" fill="#FFC23D" stroke="#2B2150" stroke-width="3"></circle>
<g class="anim bob">
<path class="anim flicker" d="M100 70 C 86 56, 90 40, 102 24 C 104 40, 122 46, 112 68 Z" fill="#FFC23D" stroke="#2B2150" stroke-width="5" stroke-linejoin="round"></path>
<path d="M48 122 C 48 84, 76 64, 100 64 C 128 64, 152 84, 152 122 C 152 156, 128 172, 100 172 C 72 172, 48 156, 48 122 Z" fill="#FF9A3C" stroke="#2B2150" stroke-width="6"></path>
<ellipse cx="100" cy="136" rx="36" ry="22" fill="#FFC23D" opacity="0.55"></ellipse>
<path d="M76 112 Q 84 101 92 112" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path>
<path d="M108 112 Q 116 101 124 112" fill="none" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path>
<ellipse cx="70" cy="128" rx="8" ry="5" fill="#FF6B5A"></ellipse>
<ellipse cx="130" cy="128" rx="8" ry="5" fill="#FF6B5A"></ellipse>
<path d="M88 130 Q 100 148 112 130 Z" fill="#7A2A1C" stroke="#2B2150" stroke-width="4" stroke-linejoin="round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{isBrulant}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Flamme surexcitée">
<path d="M34 64 L40 56 L46 64 L40 72 Z" fill="#FFC23D" stroke="#2B2150" stroke-width="3" stroke-linejoin="round"></path>
<path d="M156 46 L163 37 L170 46 L163 55 Z" fill="#FFC23D" stroke="#2B2150" stroke-width="3" stroke-linejoin="round"></path>
<path d="M168 112 L173 106 L178 112 L173 118 Z" fill="#FF5A36" stroke="#2B2150" stroke-width="3" stroke-linejoin="round"></path>
<g class="anim flicker">
<path d="M100 20 C 120 58, 160 70, 156 122 C 152 165, 124 182, 100 182 C 72 182, 44 164, 44 124 C 44 92, 66 84, 70 56 C 82 72, 88 80, 92 82 C 92 60, 94 40, 100 20 Z" fill="#FF5A36" stroke="#2B2150" stroke-width="6" stroke-linejoin="round"></path>
<path d="M100 88 C 112 108, 132 118, 130 142 C 128 162, 114 172, 100 172 C 84 172, 70 160, 70 142 C 70 122, 92 114, 100 88 Z" fill="#FFC23D"></path>
<path d="M76 112 L94 118" stroke="#2B2150" stroke-width="4.5" stroke-linecap="round"></path>
<path d="M124 112 L106 118" stroke="#2B2150" stroke-width="4.5" stroke-linecap="round"></path>
<ellipse cx="88" cy="132" rx="9" ry="11" fill="#FFFFFF" stroke="#2B2150" stroke-width="4"></ellipse>
<ellipse cx="112" cy="132" rx="9" ry="11" fill="#FFFFFF" stroke="#2B2150" stroke-width="4"></ellipse>
<circle cx="90" cy="134" r="5" fill="#2B2150"></circle>
<circle cx="110" cy="134" r="5" fill="#2B2150"></circle>
<path d="M88 152 Q 100 170 112 152 Z" fill="#7A2A1C" stroke="#2B2150" stroke-width="4" stroke-linejoin="round"></path>
</g>
</svg>
</sc-if>

<sc-if value="{{isTrouve}}" hint-placeholder-val="{{ false }}">
<svg viewBox="0 0 200 200" width="100%" height="100%" role="img" aria-label="Soleil victorieux à lunettes">
<g class="anim spin"><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(0 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(45 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(90 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(135 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(180 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(225 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(270 100 104)"></rect><rect x="93" y="13" width="14" height="22" rx="7" fill="#FFB020" stroke="#2B2150" stroke-width="4" transform="rotate(315 100 104)"></rect></g><g class="anim bob"><circle cx="100" cy="104" r="58" fill="#FFD23F" stroke="#2B2150" stroke-width="6"></circle><path d="M58 92 L142 92" stroke="#2B2150" stroke-width="5" stroke-linecap="round"></path><path d="M62 90 H96 V100 Q 96 114 80 114 Q 64 114 62 100 Z" fill="#2B2150"></path><path d="M104 90 H138 V100 Q 136 114 120 114 Q 104 114 104 100 Z" fill="#2B2150"></path><path d="M70 96 L78 96 M112 96 L120 96" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"></path><ellipse cx="66" cy="118" rx="8" ry="5" fill="#FF9A3C"></ellipse><ellipse cx="134" cy="118" rx="8" ry="5" fill="#FF9A3C"></ellipse><path d="M84 130 Q 104 142 122 124" fill="none" stroke="#2B2150" stroke-width="5.5" stroke-linecap="round"></path></g>
</svg>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mood":{"editor":"enum","options":["glacial","froid","tiede","chaud","brulant","trouve"],"default":"chaud"},"size":{"editor":"int","min":48,"max":400,"default":200},"$preview":{"width":200,"height":200}}'>
class Component extends DCLogic {
renderVals() {
const m = this.props.mood ?? 'chaud';
const s = this.props.size ?? 200;
return {
px: s + 'px',
isGlacial: m === 'glacial',
isFroid: m === 'froid',
isTiede: m === 'tiede',
isChaud: m === 'chaud',
isBrulant: m === 'brulant',
isTrouve: m === 'trouve'
};
}
}
</script>
</body>
</html>
