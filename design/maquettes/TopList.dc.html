<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Liste des mots les plus chauds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="display: flex; flex-direction: column; gap: 6px; font-family: 'Fredoka', system-ui, sans-serif; color: {{ink}}">
<sc-for list="{{rows}}" as="g" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px; height: {{g.h}}; scroll-snap-align: start; flex-shrink: 0; box-sizing: border-box; background: {{g.bg}}; border: {{g.border}}; border-radius: 14px; padding: 0 12px 0 8px">
<span style="width: 26px; height: 26px; flex-shrink: 0; box-sizing: border-box; border-radius: 13px; background: {{g.medal}}; border: 2px solid transparent; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700"><sc-if value="{{g.isHint}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Indice"><path d="M12 2.5a6.5 6.5 0 0 0-3.9 11.7c.7.5 1.1 1.3 1.1 2.1V17h5.6v-.7c0-.8.4-1.6 1.1-2.1A6.5 6.5 0 0 0 12 2.5z" fill="#FFD45C"></path><path d="M9.5 20h5M10.5 22.5h3"></path></svg></sc-if>{{g.pos}}</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
<span style="display: flex; align-items: baseline; gap: 6px; min-width: 0"><span style="font-size: 16px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.word}}</span><sc-if value="{{g.isHint}}" hint-placeholder-val="{{ false }}"><span style="flex-shrink: 0; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #B4580A">indice</span></sc-if></span>
<span style="height: 6px; border-radius: 3px; background: #E2DEEE; overflow: hidden"><span style="display: block; height: 100%; width: {{g.w}}; border-radius: 3px; background: {{g.bar}}"></span></span>
</div>
<span style="width: 50px; text-align: right; font-size: 16px; font-weight: 700">{{g.temp}}</span>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"list":{"editor":null},"last":{"editor":"text","default":"cheminée"},"limit":{"editor":"int","min":1,"max":20,"default":6},"rowh":{"editor":"int","min":32,"max":60,"default":44},"ink":{"editor":"color","default":"#2B2150"},"panel":{"editor":"color","default":"#F4F1FF"},"accent":{"editor":"color","default":"#FFD45C"},"$preview":{"width":358,"height":350}}'>
class Component extends DCLogic {
colorOf(t) { return t >= 100 ? '#FFB020' : t >= 60 ? '#FF5A36' : t >= 40 ? '#FF9A3C' : t >= 20 ? '#5FC3EE' : t >= 0 ? '#9DBDF0' : '#5B8DEF'; }
renderVals() {
const list = this.props.list ?? [{ word: 'cheminée', t: 47.0 }, { word: 'four', t: 39.4 }, { word: 'soleil', t: 31.6 }, { word: 'cuisine', t: 18.7 }, { word: 'océan', t: -4.2 }, { word: 'forêt', t: -18.5 }];
const ink = this.props.ink ?? '#2B2150';
const accent = this.props.accent ?? '#FFD45C';
const last = this.props.last ?? 'cheminée';
const medals = ['#FFD23F', '#E4E1EE', '#F2B987'];
let rank = 0;
const rows = list.slice().sort((a, b) => b.t - a.t).slice(0, this.props.limit ?? 6).map((g, i) => ({
isHint: !!g.hint,
pos: g.hint ? '' : ++rank,
h: (this.props.rowh ?? 44) + 'px',
word: g.word,
temp: g.t.toFixed(1).replace('.', ','),
w: Math.max(4, Math.min(100, (g.t + 30) / 130 * 100)) + '%',
bar: this.colorOf(g.t),
medal: g.hint ? '#FFD45C' : rank <= 3 ? medals[rank - 1] : '#FFFFFF',
bg: g.hint ? '#FFF4D6' : g.word === last ? '#FFF3B0' : (this.props.panel ?? '#F4F1FF'),
border: 'none'
}));
return { rows: rows, ink: ink, panel: this.props.panel ?? '#F4F1FF' };
}
}
</script>
</body>
</html>
